# P3 部署模板：TLS + 限流 + 反代（域名按实际替换）
limit_req_zone $binary_remote_addr zone=market_api:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name market.example.com;

    ssl_certificate     /etc/letsencrypt/live/market.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market.example.com/privkey.pem;

    client_max_body_size 64m;          # 插件包上传
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /v1/ {
        limit_req zone=market_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # 禁止目录列表与源码泄露
    location ~ /\.(?!well-known) { deny all; }
}

server {
    listen 80;
    server_name market.example.com;
    return 301 https://$host$request_uri;
}
